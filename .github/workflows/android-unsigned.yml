name: Android Unsigned

on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  android:
    name: Android unsigned (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 收集未簽名 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          V="${{ steps.ver.outputs.version }}"
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            cp "$f" "artifacts/HGhub_${V}_${abi}.apk"
            found=$((found+1))
          done
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: artifacts/*
          if-no-files-found: error
